name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: true

jobs:
  test-build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          SITE_URL: https://blog.ai-captain.top
      - name: Configure deployment SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.BLOG_DEPLOY_KEY }}" > ~/.ssh/blog_deploy
          chmod 600 ~/.ssh/blog_deploy
          printf '%s\n' "${{ secrets.BLOG_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Publish static site
        timeout-minutes: 300
        env:
          DEPLOY_TARGET: "${{ secrets.BLOG_USER }}@${{ secrets.BLOG_HOST }}"
        run: |
          ssh -i ~/.ssh/blog_deploy -o BatchMode=yes -o ConnectTimeout=30 "$DEPLOY_TARGET" 'command -v rsync >/dev/null'
          rsync -az --delete --partial --append-verify --timeout=60 \
            --info=stats2,progress2 \
            -e "ssh -i $HOME/.ssh/blog_deploy -o BatchMode=yes -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=4" \
            dist/ "$DEPLOY_TARGET:/srv/david-ai-journal/site/.next/"
          ssh -i ~/.ssh/blog_deploy -o BatchMode=yes -o ConnectTimeout=30 "$DEPLOY_TARGET" 'set -e; stage=/srv/david-ai-journal/site/.next; find /srv/david-ai-journal/site -mindepth 1 -maxdepth 1 ! -name .next -exec rm -rf {} +; cp -a "$stage"/. /srv/david-ai-journal/site/; rm -rf "$stage"'
